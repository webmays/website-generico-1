<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste Mobile Hero</title>
  <link rel="stylesheet" href="../styles/globals.css">
  <style>
    /* Teste de Layout Mobile */
    @media (max-width: 991px) {
      .hero-section {
        display: flex;
        flex-direction: column;
        min-height: 100svh;
        overflow: hidden;
        padding-top: 80px;
        background: #fff;
      }
      .hero-content-col {
        display: contents;
      }
      .hero-title {
        order: 1;
        font-size: clamp(2.3rem, 10vw, 3.2rem);
        line-height: 0.95;
        padding: 0 1.5rem;
        margin-bottom: 0.75rem;
      }
      .hero-title-lead-wrap .hero-accent-bar {
        width: 60px;
        height: 4px;
      }
      .hero-meta-breadcrumb {
        order: 2;
        padding: 0 1.5rem;
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        margin-bottom: 1.25rem;
      }
      .hero-actions {
        order: 3;
        padding: 0 1.5rem;
        flex-direction: column;
        align-items: stretch;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }
      .hero-actions .btn {
        width: 100%;
        justify-content: center;
        min-height: 48px;
        padding: 0.8rem 1.5rem;
      }
      .hero-visual-col {
        order: 4;
        width: 100%;
        height: 240px;
        position: relative;
        overflow: hidden;
        margin-top: 0.5rem;
      }
      .hero-fan-stage {
        position: absolute;
        left: 50%;
        top: 100%;
        width: 1440px;
        height: 760px;
        margin-left: -1520px;
        margin-top: -380px;
        transform-origin: 1520px 380px;
        transform: scale(calc(110vw / 1680));
      }
      .hero-fan-svg {
        transform: none !important;
      }
      .hero-features-row {
        order: 5;
        padding: 2rem 1.5rem 1rem;
        flex-direction: column;
      }
      .hero-contact-footer {
        order: 6;
        padding: 0 1.5rem 2rem;
      }
    }
  </style>
</head>

      <span class="brand-logo" style="font-size:1.5rem;">Steffani</span>
      <button class="mobile-nav-toggle" style="display:flex;">☰</button>
