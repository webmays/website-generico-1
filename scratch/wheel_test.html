<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel Test Mobile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #faf8f5; }

    .mobile-container {
      width: 100%;
      max-width: 390px;
      margin: 0 auto;
      background: #fff;
      min-height: 844px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .header-mock {
      height: 70px;
      padding: 1.25rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
    }

    .hero-top-text {
      padding: 1.5rem 1.5rem 0.5rem;
      display: flex;
      flex-direction: column;
    }

    .title {
      font-size: 2.5rem;
      font-family: serif;
      line-height: 0.95;
      font-weight: 700;
      color: #111;
      margin-bottom: 0.75rem;
    }

    .meta {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      font-weight: 700;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .btn {
      height: 48px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .btn-gold { background: #e5a93c; color: #111; border: none; }
    .btn-outline { background: transparent; color: #111; border: 2px solid #111; }

    /* Estágio do Carrossel na base */
    .wheel-container { width: 100%; height: 260px; position: relative; overflow: hidden; margin-top: auto; display: flex; align-items: flex-end; }

    /* Como posicionar o SVG para o arco de fotos ficar visível de ponta a ponta */
    .wheel-svg-wrap { width: 100%; height: 100%; position: relative; }

    .wheel-svg, .hero-fan-svg { width: 100%; height: 100%; display: block; }

    .hero-fan-track {
      transform-origin: 1520px 380px;
      animation: rotateFan 60s linear infinite;
    }

    @keyframes rotateFan {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
  </style>
</head>
